[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ed-compiler"
version = "0.1.0"
description = "An operator compiler for exact diagonalisation: models as terms on sites, generated C/OpenMP and CUDA kernels"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]", "threadpoolctl"]

[project.scripts]
edc = "edc_cli:main"

# The modules stay where they are (python edc_cli.py model.edc works as before); test_quickstart.py checks this list
# against the edc*.py files.  vendor/ is installed as edc_vendor/: the OpenMP runtime that edc.py loads on macOS.
[tool.setuptools]
py-modules = [
    "edc", "edc_cli", "edc_dmrg", "edc_dmrg_factor", "edc_dmrg_gpu", "edc_dmrg_gpu2", "edc_dmrg_gpu3", "edc_dmrg_gpu3g", "edc_dmrg_gpu3gr", "edc_dmrg_gpu3r",
    "edc_dmrg_gpu3s", "edc_dmrg_gpu_stub", "edc_dmrg_combine", "edc_dmrg_excited", "edc_dmrg_mirror", "edc_dmrg_state", "edc_dmrg_vector", "edc_family", "edc_glayout", "edc_gpu", "edc_gpu_lean", "edc_hubbard", "edc_hubbard_gpu",
    "edc_hubbard_sym", "edc_k", "edc_lattice", "edc_lattices", "edc_layout3", "edc_levels", "edc_measure", "edc_plan",
    "edc_rows", "edc_scan", "edc_sub",
]
packages = ["edc_vendor"]
package-dir = { edc_vendor = "vendor" }

[tool.setuptools.package-data]
edc_vendor = ["libomp/include/*.h", "libomp/lib/libomp.dylib", "libomp/LICENSE.TXT", "libomp/README.md"]
